<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E3DADI - تجهيزي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCPEMHuhGLlu-cFY8rbLRDni58dZcSjik",
            authDomain: "e3dadi-e3dadi.firebaseapp.com",
            projectId: "e3dadi-e3dadi",
            storageBucket: "e3dadi-e3dadi.firebasestorage.app",
            messagingSenderId: "503442611444",
            appId: "1:503442611444:web:19853f050ca70c763312a1"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const SUPABASE_URL = "https://wbmqgwvrucytljqfxju.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndibXFnd3ZydWN5ZnRpanFmeGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2NDM5NzksImV4cCI6MjExMTIxOTk3OX0.7HH41C0y6Vv1W-VNfCoirsNkyRr7FKWbHLxiYnx-VOs";
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const pinInput = document.getElementById('pin-input');
        const loginBtn = document.getElementById('login-btn');
        const errorMsg = document.getElementById('error-msg');
        const welcomeName = document.getElementById('welcome-name');
        const xpValue = document.getElementById('xp-value');
        const coinsValue = document.getElementById('coins-value');
        const logoutBtn = document.getElementById('logout-btn');
        const taskModal = document.getElementById('task-modal');
        const closeModalBtn = document.getElementById('close-modal');
        const photoInput = document.getElementById('photo-input');
        const submitTaskBtn = document.getElementById('submit-task-btn');
        const modalTaskName = document.getElementById('modal-task-name');

        let currentChildName = "";
        let selectedTaskName = "";

        loginBtn.addEventListener('click', async () => {
            const pin = pinInput.value.trim();
            if (!pin) return;
            loginBtn.innerText = "جاري التحقق...";
            loginBtn.disabled = true;
            errorMsg.style.display = 'none';
            try {
                const querySnapshot = await getDocs(collection(db, "Children"));
                let foundChild = null;
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (String(data.pin) === String(pin)) {
                        foundChild = data;
                        currentChildName = data.name;
                    }
                });
                if (foundChild) {
                    welcomeName.innerText = `أهلاً يا ${foundChild.name}! 👋`;
                    xpValue.innerText = foundChild.xp || 0;
                    coinsValue.innerText = foundChild.coins || 0;
                    loginSection.style.display = 'none';
                    dashboardSection.style.display = 'block';
                } else {
                    errorMsg.innerText = "الرقم السري غير موجود!";
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.innerText = "خطأ: " + error.message;
                errorMsg.style.display = 'block';
            } finally {
                loginBtn.innerText = "دخول (Login)";
                loginBtn.disabled = false;
            }
        });

        logoutBtn.addEventListener('click', () => {
            pinInput.value = '';
            dashboardSection.style.display = 'none';
            loginSection.style.display = 'block';
            errorMsg.style.display = 'none';
            currentChildName = "";
        });

        document.querySelectorAll('.task-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                selectedTaskName = e.target.parentElement.querySelector('.task-name').innerText;
                modalTaskName.innerText = selectedTaskName;
                taskModal.style.display = 'flex';
            });
        });

        closeModalBtn.addEventListener('click', () => {
            taskModal.style.display = 'none';
            photoInput.value = '';
        });

        submitTaskBtn.addEventListener('click', async () => {
            const file = photoInput.files[0];
            if (!file) {
                alert("لازم ترفع صورة الأول يا بطل!");
                return;
            }
            submitTaskBtn.innerText = "جاري الرفع...";
            submitTaskBtn.disabled = true;

            try {
                const fileName = `${currentChildName}_${Date.now()}.jpg`;
                
                // الحل: تحويل الملف إلى ArrayBuffer قبل الرفع
                const arrayBuffer = await file.arrayBuffer();

                const { data, error } = await supabaseClient.storage
                    .from('proofs')
                    .upload(fileName, arrayBuffer, {
                        cacheControl: '3600',
                        upsert: false,
                        contentType: file.type || 'image/jpeg'
                    });

                if (error) throw new Error("مشكلة Supabase: " + error.message);

                const { data: urlData } = supabaseClient.storage.from('proofs').getPublicUrl(fileName);

                await addDoc(collection(db, "Submissions"), {
                    childName: currentChildName,
                    taskName: selectedTaskName,
                    photoURL: urlData.publicUrl,
                    status: "pending",
                    timestamp: new Date()
                });

                alert("عاش! الصورة اترفعت والقائد هيراجعها قريب.");
                taskModal.style.display = 'none';
                photoInput.value = '';

            } catch (error) {
                console.error(error);
                alert("حصل خطأ: " + error.message);
            } finally {
                submitTaskBtn.innerText = "إرسال للقائد";
                submitTaskBtn.disabled = false;
            }
        });
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h1 { color: #ff4757; margin-bottom: 5px; }
        #pin-input { width: 80%; padding: 15px; font-size: 18px; border: 2px solid #dfe4ea; border-radius: 10px; margin-bottom: 15px; text-align: center; letter-spacing: 5px; }
        #login-btn { width: 90%; padding: 15px; background: #ff4757; color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; }
        #error-msg { color: #ff4757; display: none; margin-top: 15px; font-weight: bold; }
        #dashboard-section { display: none; }
        .stats { display: flex; justify-content: space-around; margin: 20px 0; }
        .stat-card { background: #f1f2f6; padding: 15px; border-radius: 15px; width: 40%; }
        .stat-card p { font-size: 24px; font-weight: bold; color: #ff4757; margin: 5px 0 0 0; }
        .task-card { background: #fff; border: 2px solid #dfe4ea; border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .task-btn { background: #2ed573; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        #logout-btn { background: #747d8c; color: white; border: none; padding: 10px 20px; border-radius: 10px; margin-top: 20px; cursor: pointer; }
        #task-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 80%; max-width: 350px; text-align: center; }
        .modal-content h2 { color: #2f3542; }
        #photo-input { margin: 15px 0; }
        #submit-task-btn { background: #2ed573; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px;}
        #close-modal { background: #ff4757; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div id="login-section">
            <h1>E3DADI</h1>
            <h2>ادخل رقمك السري</h2>
            <input type="password" id="pin-input" placeholder="****" maxlength="10">
            <br>
            <button id="login-btn">دخول (Login)</button>
            <p id="error-msg"></p>
        </div>
        <div id="dashboard-section">
            <h1 id="welcome-name">Welcome!</h1>
            <div class="stats">
                <div class="stat-card"><h3>نقط الخبرة (XP)</h3><p id="xp-value">0</p></div>
                <div class="stat-card"><h3>النقط (Coins)</h3><p id="coins-value">0</p></div>
            </div>
            <h3 style="text-align: right; color: #2f3542;">مهامي (My Tasks)</h3>
            <div class="task-card">
                <span class="task-name">اقرأ الإنجيل 📖</span>
                <button class="task-btn">خلصتها ✅</button>
            </div>
            <div class="task-card">
                <span class="task-name">رتب أوضتك 🧹</span>
                <button class="task-btn">خلصتها ✅</button>
            </div>
            <button id="logout-btn">تسجيل خروج</button>
        </div>
    </div>
    <div id="task-modal">
        <div class="modal-content">
            <h2>مهمة: <span id="modal-task-name"></span></h2>
            <p>ارفع صورة الإثبات 📸</p>
            <input type="file" id="photo-input" accept="image/*">
            <button id="submit-task-btn">إرسال للقائد</button>
            <button id="close-modal">إلغاء</button>
        </div>
    </div>
</body>
</html>
